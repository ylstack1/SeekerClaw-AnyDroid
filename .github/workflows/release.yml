name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-dappstore:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for git rev-list

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Decode dApp Store keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/dappstore-release.jks

      - name: Build dApp Store release APK
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "Building with VERSION_CODE=$VERSION_CODE"
          chmod +x gradlew && VERSION_CODE=$VERSION_CODE ./gradlew assembleDappStoreRelease
        env:
          SEEKERCLAW_KEYSTORE_PATH: app/dappstore-release.jks
          SEEKERCLAW_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SEEKERCLAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SEEKERCLAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/dappStore/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No dApp Store release APK found"
            exit 1
          fi
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner verify "$APK"
          echo "APK signed successfully: $APK"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/dappStore/release -name '*.apk' | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="SeekerClaw-${{ github.ref_name }}-dappStore.apk"
          else
            NAME="SeekerClaw-latest-dappStore.apk"
          fi
          mv "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dappstore-apk
          path: "${{ env.APK_NAME }}"

  build-googleplay:
    runs-on: ubuntu-latest

    env:
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Decode Google Play keystore
        if: env.PLAY_KEYSTORE_BASE64 != ''
        run: echo "$PLAY_KEYSTORE_BASE64" | base64 -d > app/googleplay-release.jks

      - name: Build Google Play release AAB and APK
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "Building with VERSION_CODE=$VERSION_CODE"
          chmod +x gradlew && VERSION_CODE=$VERSION_CODE ./gradlew bundleGooglePlayRelease assembleGooglePlayRelease
        env:
          PLAY_KEYSTORE_PATH: app/googleplay-release.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/googlePlay/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No Google Play release APK found"
            exit 1
          fi
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner verify "$APK"
          echo "APK signed successfully: $APK"

      - name: Rename artifacts
        run: |
          AAB=$(find app/build/outputs/bundle/googlePlayRelease -name '*.aab' | head -1)
          APK=$(find app/build/outputs/apk/googlePlay/release -name '*.apk' | head -1)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            AAB_NAME="SeekerClaw-${{ github.ref_name }}.aab"
            APK_NAME="SeekerClaw-${{ github.ref_name }}-googlePlay.apk"
          else
            AAB_NAME="SeekerClaw-latest.aab"
            APK_NAME="SeekerClaw-latest-googlePlay.apk"
          fi
          if [ -n "$AAB" ]; then mv "$AAB" "$AAB_NAME"; fi
          if [ -n "$APK" ]; then mv "$APK" "$APK_NAME"; fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: googleplay-artifacts
          path: |
            SeekerClaw-*.aab
            SeekerClaw-*-googlePlay.apk
          if-no-files-found: ignore

  release:
    needs: [build-dappstore, build-googleplay]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dApp Store APK
        uses: actions/download-artifact@v4
        with:
          name: dappstore-apk
          path: artifacts/
          merge-multiple: true

      - name: Download Google Play artifacts
        uses: actions/download-artifact@v4
        with:
          name: googleplay-artifacts
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Set Release Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=SeekerClaw ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ contains(github.ref_name, '-rc') }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Latest Build" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for version
        id: changelog
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          NOTES=$(awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "No changelog entry found for v${TAG}, using auto-generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "notes<<CHANGELOG_EOF"
              echo "$NOTES"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Update Latest Tag
        if: github.ref_name == 'main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.changelog.outputs.notes || 'Automated build from latest main branch.' }}
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: artifacts/*
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') }}

      - name: Add Job Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts included in release:" >> $GITHUB_STEP_SUMMARY
          ls artifacts/ | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || echo "No artifacts found" >> $GITHUB_STEP_SUMMARY
